# RESEARCH: GitHub Actions reads every YAML file under .github/workflows/ as an
# independent workflow. When does splitting into multiple files help vs hurt?
# (Hint: think about triggers, required-status-checks for branch protection, and
# the `permissions:` scope — narrower-scoped workflows are easier to reason about
# from a security standpoint.)

name: CI
# RESEARCH: this `name` shows in the Actions tab UI. Branch protection's
# "required status checks", however, references JOB names (`build` below), not
# workflow names. Worth knowing now so it isn't a surprise when you wire branch
# protection later.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (debug, macOS arm64)
    runs-on: macos-14

    steps:
      - name: Checkout
        # RESEARCH: pinning `@v4` (a moving tag) vs pinning to a full SHA. The
        # OpenSSF "Securing Workflows" guide recommends SHA pins for third-party
        # actions because tags can be re-pointed. actions/checkout is first-party
        # GitHub, so the risk is small — but read the argument and pick deliberately.
        uses: actions/checkout@v4

      - name: Install LLVM
        run: brew install llvm

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build build/debug


      - name: Smoketest (run binary)

        run: ./build/debug/debugger

      # TODO (tests): once Catch2/doctest is wired and you have at least one passing
      # TEST_CASE, add a step:  ctest --preset debug
      # If tests get slow enough to be worth parallelizing, split this off into its
      # own job that `needs: build` and downloads the build dir as an artifact.
      # Don't preempt the split — single-job is simpler and faster than artifact
      # upload/download for fast test suites.

      - name: Run Tests

        run: ctest --preset debug
        
      # TODO (format/tidy): SEPARATE JOB, not a step here. Reasons:
      #   (a) parallelism — runs alongside build instead of after,
      #   (b) different runner — format-check doesn't need LLVM, can use a much
      #       faster ubuntu-latest runner with just `clang-format` installed,
      #   (c) cleaner required-check granularity for branch protection.
  build:
    name: Linter (Ubuntu v.24.04)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirm clang-format
        run: clang-format --version
      # TODO (release matrix): add a sibling job that builds --preset release. Two
      # ways to express it:
      #   (1) duplicate the job with `--preset release`,
      #   (2) use `strategy.matrix` to parameterize over preset names.
      # Research the matrix syntax and decide. Two presets is right at the boundary
      # where matrix starts to pay off.

      # TODO (caching): three layers, in order of payoff. Add LAST, after the
      # uncached workflow is green — caching bugs look like flakes and are
      # exhausting to debug:
      #   1. Homebrew LLVM cellar — biggest win (~5min/run). Cache /opt/homebrew/Cellar/llvm
      #      and /opt/homebrew/opt/llvm, key on the brew formula version.
      #   2. ccache — significant once you have real source. Cache the ccache dir,
      #      key on compiler version + a hash of source files (so a code change
      #      doesn't invalidate the whole cache, just the affected objects).
      #   3. CMake `_deps/` directory — small now, matters once FetchContent pulls
      #      ftxui. Key on a hash of CMakeLists.txt.
